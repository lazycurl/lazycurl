name: workflow-php8

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHP 8 series
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP v${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, openssl
          coverage: none

      - name: Execute Test
        run: php workflow-test.php
