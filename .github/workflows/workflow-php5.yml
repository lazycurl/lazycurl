name: workflow-php5

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-test
      queue: max

    strategy:
      fail-fast: false
      matrix:
        # PHP 5 series
        php-version: ['5.3', '5.4', '5.5', '5.6']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP v${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, openssl
          coverage: none

      - name: Execute Test
        run: php workflow-test.php
